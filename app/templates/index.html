<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Support CRM</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-brand">
  <span class="eyebrow">Datastraw</span>
  <h1>Support CRM</h1>
</div>
    <a href="/create" class="btn-primary">+ New Ticket</a>
  </header>

  <main class="container">
    <div class="controls">
      <input
        type="text"
        id="searchInput"
        placeholder="Search by name, email, ID, or description..."
      />
      <select id="statusFilter">
        <option value="">All Statuses</option>
        <option value="Open">Open</option>
        <option value="In Progress">In Progress</option>
        <option value="Closed">Closed</option>
      </select>
    </div>

   <div class="table-scroll">
    <table class="ticket-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Subject</th>
          <th>Status</th>
          <th>Date</th>
        </tr>
      </thead>
      <tbody id="ticketTableBody">
        <!-- Rows get filled in dynamically by script.js -->
      </tbody>
    </table>
  </div>

    <p id="emptyState" class="empty-state" style="display:none;">
      No tickets found.
    </p>

    <div class="pagination" id="pagination" style="display:none;">
      <button id="prevPageBtn" class="btn-secondary-outline">&larr; Previous</button>
      <span id="pageIndicator">Page 1 of 1</span>
      <button id="nextPageBtn" class="btn-secondary-outline">Next &rarr;</button>
    </div>
  </main>

  <script src="/static/script.js"></script>
  <script>
    // Runs the list-loading logic defined in script.js
    loadTickets();
  </script>
</body>
</html>
